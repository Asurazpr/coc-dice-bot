name: tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install -r requirements-dev.txt
      - run: python -m pytest -q --junitxml=pytest-report.xml
      - name: Report test results as annotations
        if: always()
        run: python scripts/ci_annotate.py pytest-report.xml
      - name: Occupation catalogue matches the spreadsheets
        if: matrix.python-version == '3.12'
        run: |
          pip install "openpyxl>=3.1"
          python scripts/import_occupations.py --check
